}

const groups=batches.map((b,bi)=>{
  const g=L.layerGroup().addTo(map);
  for(const it of b.items){
    const mk=L.marker([it.lat,it.lng],{icon:L.divIcon({className:'',html:'<div class="pin" style="cursor:pointer;background:'+b.color+'">'+(b.items.length>9?b.n:bi+1+'.'+it.n)+'</div>',iconSize:[28,28],iconAnchor:[14,14]}),title:'Открыть объявление'})
     .addTo(g).bindTooltip(it.lbl,{permanent:true,direction:'right',className:'lbl'});
    mk.on('click',()=>window.open(it.u,'_blank'));
  }
  return g;
});
const bar=document.getElementById('batchbar');
bar.innerHTML=batches.map((b,i)=>'<label><input type="checkbox" data-i="'+i+'" checked><span style="color:'+b.color+'">●</span> '+b.name+'</label>').join('')+'<button id="balloon">все</button> <button id="bnone">снять</button>';
bar.addEventListener('change',e=>{const i=+e.target.dataset.i; if(isNaN(i))return; e.target.checked?map.addLayer(groups[i]):map.removeLayer(groups[i]);});
document.getElementById('balloon').onclick=()=>{bar.querySelectorAll('input').forEach(c=>{c.checked=true;map.addLayer(groups[+c.dataset.i]);});};
document.getElementById('bnone').onclick=()=>{bar.querySelectorAll('input').forEach(c=>{c.checked=false;map.removeLayer(groups[+c.dataset.i]);});};
